# Nom du workflow, affiché dans l'onglet Actions.
# Le CD s'y réfère dans "workflow_run" : les deux noms doivent être identiques.
name: CI pipeline

# Déclencheurs : les événements qui lancent le workflow
on:
  push:
    branches: [ main ]        # à chaque push sur la branche main
  pull_request:
    branches: [ main ]        # à chaque pull request visant main
  workflow_dispatch:          # lancement manuel (bouton "Run workflow" dans Actions)

# Droits accordés au GITHUB_TOKEN pour tout le workflow (le strict nécessaire)
permissions:
  contents: read              # lire le code du dépôt
  security-events: write      # écrire les alertes dans l'onglet Security (résultats Trivy)
  actions: read               # lire les infos d'exécution, requis par upload-sarif

jobs:
  # ---- Job 1 : tests et qualité du code ----
  test:
    runs-on: ubuntu-latest    # machine virtuelle Linux fournie par GitHub

    # Matrice : le job est lancé une fois par version, en parallèle (3 exécutions)
    strategy:
      matrix:
        # '3.10' entre guillemets, sinon YAML le lit comme le nombre 3.1
        python-version: [3.8, 3.9, '3.10']

    steps:
      # Étape 1 : récupérer le code du dépôt sur la machine (elle démarre vide)
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : installer la version de Python de l'exécution en cours
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Étape 3 : installer les outils (le "|" permet d'écrire plusieurs commandes)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      # Étape 4 : analyse du style et des erreurs avec Flake8, en deux passes
      - name: Lint with flake8
        run: |
          # Passe 1, bloquante : erreurs de syntaxe et noms non définis.
          # Si une erreur est trouvée, le job échoue.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Passe 2, informative : tous les autres défauts (style, complexité,
          # lignes de plus de 127 caractères). --exit-zero = ne fait jamais échouer le job.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Étape 5 : exécuter les tests ; un seul test en échec fait échouer le job
      - name: Test with pytest
        run: |
          pytest tests/

  # ---- Job 2 : scan de vulnérabilités (tourne en parallèle du job test) ----
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      # Nouvelle machine, donc il faut récupérer le code à nouveau
      - name: Checkout code
        uses: actions/checkout@v3

      # Scan Trivy. L'action est épinglée sur un hash de commit (immuable) ;
      # le commentaire en fin de ligne rappelle la version correspondante.
      - name: Run Trivy vulnerability scanner in filesystem mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'                  # fs = scanne les fichiers du dépôt (pas une image Docker)
          scan-ref: '.'                    # dossier à scanner : la racine du dépôt
          format: 'sarif'                  # format de rapport compris par GitHub
          output: 'trivy-results.sarif'    # fichier où le rapport est écrit
          severity: 'CRITICAL,HIGH'        # ne garder que les failles critiques et élevées

      # Envoi du rapport vers l'onglet Security > Code scanning
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
